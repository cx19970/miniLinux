# miniLinux image layout (sourceable by sh)
# FAT volume labels are max 11 chars, so ESP uses MINLINUXESP not MINILINUXESP.

# Architecture [amd64]
ARCH=amd64

# GRUB Version [grub | grub2]
GRUB_VERSION=grub2

# EFI build mode [mini | full]
# mini: essential modules for booting, full: all supported modules
EFI_BUILD_MODE=mini

# ESP Size [* MiB]
# not less than 4MB
ESP_SIZE_MIB=8

# Boot Size [* MiB]
# not less than 4MB
BOOT_SIZE_MIB=80

# Image Name [*.img]
IMAGE_NAME=minilinux-amd64.img
